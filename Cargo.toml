[workspace]
resolver = "2"
members = [
    "query-node",
    "compute-node",
    "storage-node",
    "shared",
    "integration-tests",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["WOW-DB Contributors"]
license    = "Apache-2.0"
repository = "https://github.com/wow-db/wow-db"

[workspace.dependencies]
# Async runtime
tokio        = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Async utilities
async-trait = "0.1"
futures     = "0.3"

# gRPC
tonic  = "0.12"
prost  = "0.13"

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Error handling
thiserror = "1"
anyhow    = "1"

# UUID / time
uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender   = "0.2"

# Columnar data
arrow2 = { version = "0.18", features = ["io_ipc", "compute"] }

# Workspace-internal
shared = { path = "shared" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1  # Faster incremental dev builds
