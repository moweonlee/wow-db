# WOW-DB Storage Node — 로컬 개발 단일 인스턴스 설정
# 사용: scripts/dev/run-local.sh 또는 run-local.ps1 이 자동으로 사용
# 직접 실행: storage-node --config dev/configs/storage-node-local.toml

[node]
id        = "sn-local-1"   # 환경변수 NODE_ID로 오버라이드
log_level = "debug"

[grpc]
bind = "127.0.0.1"
port = 9060

[http]
# Spark Stream Load HTTP 서버
bind = "127.0.0.1"
port = 8040

[storage]
# 로컬 개발: native backend (S3/HDFS 불필요)
backend  = "native"
# 환경변수 DATA_DIR로 오버라이드 가능
data_dir = "/tmp/wowdb-dev/sn"

[storage.native]
memtable_size_mb    = 32      # 개발용 작은 값
block_cache_size_mb = 128     # 개발용 작은 값
io_uring_enabled    = false   # Linux io_uring: 개발 환경에서는 비활성화

[compaction]
enabled          = true
max_concurrent   = 1          # 개발용: 단일 compaction 스레드
level0_file_count_trigger = 4
level_size_multiplier     = 10

[ttl]
check_interval_s = 3600

[tablet]
replica_count = 1             # 로컬 단일 노드: 복제본 1개

[disk_monitor]
# 디스크 용량 감시 — 개발 환경에서는 임계값을 높여 쓰기 차단 방지
disk_full_threshold     = 0.98
disk_recovery_threshold = 0.95
poll_interval_s         = 10
